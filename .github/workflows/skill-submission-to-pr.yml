name: Skill submission to PR

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to ingest
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-skill-pr:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Skill]') || contains(github.event.issue.labels.*.name, 'skill-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch issue body
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.eventName === 'workflow_dispatch'
              ? Number(core.getInput('issue_number'))
              : context.issue.number;
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });
            core.setOutput('number', String(issue_number));
            core.setOutput('title', data.title);
            core.setOutput('body_path', 'issue-body.md');
            require('fs').writeFileSync('issue-body.md', data.body || '', 'utf8');

      - name: Generate skill file
        run: |
          python scripts/ingest_issue.py \
            --issue-number "${{ steps.issue.outputs.number }}" \
            --issue-title "${{ steps.issue.outputs.title }}" \
            --issue-body-file issue-body.md

      - name: Show generated changes
        run: |
          git status --short
          git diff --stat

      - name: Ensure labels exist
        uses: actions/github-script@v7
        with:
          script: |
            const labels = [
              { name: 'skill-submission', color: '0E8A16', description: 'Skill contribution issue' },
              { name: 'skill-review', color: '1D76DB', description: 'Generated skill PR awaiting review' }
            ];

            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label
                });
              }
            }

      - name: Commit and push skill branch
        id: skill_branch
        shell: bash
        run: |
          set -euo pipefail

          branch="skill-submission/issue-${{ steps.issue.outputs.number }}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add skills index

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No generated skill changes detected."
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          git commit -m "Add skill from issue #${{ steps.issue.outputs.number }}"
          git push --force-with-lease origin "$branch"
          git ls-remote --heads origin "$branch"

      - name: Create draft PR
        if: steps.skill_branch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.skill_branch.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          title="Add skill from issue #${ISSUE_NUMBER}"
          body="This draft PR was generated from issue #${ISSUE_NUMBER}.

          Internal reviewers should verify classification, quality, originality, and formatting before marking it ready."

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Base: main"
          echo "Head: ${BRANCH}"
          gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // ""'

          existing_url="$(gh pr list --base main --head "$BRANCH" --state open --json url --jq '.[0].url // ""')"
          if [ -n "$existing_url" ]; then
            echo "Draft PR already exists: $existing_url"
            exit 0
          fi

          gh pr create \
            --draft \
            --base main \
            --head "$BRANCH" \
            --title "$title" \
            --body "$body"
