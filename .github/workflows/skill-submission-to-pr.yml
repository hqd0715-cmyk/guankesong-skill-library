name: Skill submission to PR

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to ingest
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: skill-submission-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  create-skill-pr:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Skill]') || contains(github.event.issue.labels.*.name, 'skill-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            issue_number="$DISPATCH_ISSUE_NUMBER"
          else
            issue_number="$EVENT_ISSUE_NUMBER"
          fi
          if [[ ! "$issue_number" =~ ^[0-9]+$ ]]; then
            echo "::error::Issue number must contain digits only"
            exit 1
          fi

          echo "Fetching issue #${issue_number} from ${GITHUB_REPOSITORY}"
          gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" \
            --json title --jq '.title' > issue-title.txt
          gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body // ""' > issue-body.md
          issue_author="$(
            gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" \
              --json author --jq '.author.login'
          )"

          echo "number=${issue_number}" >> "$GITHUB_OUTPUT"
          echo "author=${issue_author}" >> "$GITHUB_OUTPUT"

      - name: Classify and authorize submission
        id: authorization
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_AUTHOR: ${{ steps.issue.outputs.author }}
        shell: bash
        run: |
          set -euo pipefail

          submission_type="$(
            python scripts/ingest_issue.py \
              --issue-body-file issue-body.md \
              --print-field submission_type
          )"
          echo "submission_type=${submission_type}" >> "$GITHUB_OUTPUT"

          case "$submission_type" in
            internal-proxy)
              permission="$(
                gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ISSUE_AUTHOR}/permission" \
                  --jq '.permission' 2>/dev/null || echo "none"
              )"
              case "$permission" in
                admin|maintain|write)
                  echo "authorized=true" >> "$GITHUB_OUTPUT"
                  echo "Authorized internal submitter: ${ISSUE_AUTHOR} (${permission})"
                  ;;
                *)
                  echo "::error::internal-proxy requires write, maintain, or admin permission"
                  exit 1
                  ;;
              esac
              ;;
            external-claude-code|external-codex|external-manual)
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              echo "Authorized external Issue submission: ${ISSUE_AUTHOR} (${submission_type})"
              ;;
            *)
              echo "::error::Unsupported submission type: ${submission_type}"
              exit 1
              ;;
          esac

      - name: Check for already merged submission
        id: merged_submission
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          branch="skill-submission/issue-${ISSUE_NUMBER}"
          merged_number="$(
            gh search prs \
              --repo "$GITHUB_REPOSITORY" \
              --merged \
              --head "$branch" \
              --json number \
              --jq '.[0].number // ""'
          )"
          if [ -z "$merged_number" ]; then
            echo "already_merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "already_merged=true" >> "$GITHUB_OUTPUT"
          merged_url="$(
            gh pr view "$merged_number" \
              --repo "$GITHUB_REPOSITORY" \
              --json url \
              --jq '.url'
          )"
          marker="<!-- skill-submission-pr:${ISSUE_NUMBER} -->"
          comment_body="$(cat <<EOF
          ${marker}
          已合并入库投稿 PR：#${merged_number}

          当前状态：已合并到 main。GitHub Pages 部署完成后，可在共创库页面检索。
          重新运行投稿工作流不会再为同一 Issue 创建重复 PR。

          PR 链接：${merged_url}
          EOF
          )"
          comment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
              | head -n 1
          )"
          if [ -n "$comment_id" ]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$comment_body" \
              >/dev/null
          else
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$comment_body"
          fi

      - name: Generate skill package
        if: steps.merged_submission.outputs.already_merged != 'true'
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_AUTHOR: ${{ steps.issue.outputs.author }}
        run: |
          python scripts/ingest_issue.py \
            --issue-number "$ISSUE_NUMBER" \
            --issue-title-file issue-title.txt \
            --issue-author "$ISSUE_AUTHOR" \
            --issue-body-file issue-body.md

      - name: Validate skill packages
        if: steps.merged_submission.outputs.already_merged != 'true'
        run: python scripts/validate_skills.py

      - name: Show generated changes
        if: steps.merged_submission.outputs.already_merged != 'true'
        run: |
          git status --short
          git diff --stat

      - name: Commit and push skill branch
        if: steps.merged_submission.outputs.already_merged != 'true'
        id: skill_branch
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          branch="skill-submission/issue-${ISSUE_NUMBER}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add skills index

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No generated skill changes detected."
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          timestamp="$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
          git commit -m "${timestamp}｜生成 issue #${ISSUE_NUMBER} 的 Skill 投稿包"
          git push --force origin "$branch"
          git ls-remote --heads origin "$branch"

      - name: Create or update draft PR
        if: steps.merged_submission.outputs.already_merged != 'true' && steps.skill_branch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.skill_branch.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          SUBMISSION_TYPE: ${{ steps.authorization.outputs.submission_type }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          skill_title="$(
            python scripts/ingest_issue.py \
              --issue-title-file issue-title.txt \
              --issue-body-file issue-body.md \
              --print-field title
          )"
          if [ -z "$skill_title" ]; then
            skill_title="$(sed -E 's/^\[Skill\][[:space:]]*//' issue-title.txt | head -n 1)"
          fi

          title="Skill 投稿 #${ISSUE_NUMBER}：${skill_title} (${SUBMISSION_TYPE})"
          body="$(cat <<EOF
          This PR was generated from issue #${ISSUE_NUMBER}.

          Closes #${ISSUE_NUMBER}

          Submission type: \`${SUBMISSION_TYPE}\`

          Status:
          - Issue accepted and skill package generated.
          - Maintainers must review Agent Skill structure, Codex/Claude Code compatibility, attribution, source, publication status, classification, quality, originality, and formatting.
          - The skill appears in the public catalog only after this PR is merged into \`main\` and GitHub Pages deploys.
          EOF
          )"

          existing_number="$(
            gh pr list \
              --base main \
              --head "${REPOSITORY_OWNER}:${BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number // ""'
          )"
          if [ -n "$existing_number" ]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/pulls/${existing_number}" \
              -f title="$title" \
              -f body="$body" \
              >/dev/null
            pr_number="$existing_number"
            pr_url="$(
              gh pr view "$pr_number" \
                --repo "$GITHUB_REPOSITORY" \
                --json url \
                --jq '.url'
            )"
            echo "Updated Draft PR #${existing_number}"
          else
            pr_url="$(
              gh pr create \
              --draft \
              --base main \
              --head "${REPOSITORY_OWNER}:${BRANCH}" \
              --title "$title" \
              --body "$body"
            )"
            pr_number="${pr_url##*/}"
          fi

          marker="<!-- skill-submission-pr:${ISSUE_NUMBER} -->"
          comment_body="$(cat <<EOF
          ${marker}
          已生成/更新投稿 PR：#${pr_number}

          当前状态：等待维护者审核与合并。
          合并后才会进入共创库页面；只创建 Issue 不代表已经入库。

          PR 链接：${pr_url}
          EOF
          )"
          comment_id="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"${marker}\"))) | .id" \
              | head -n 1
          )"
          if [ -n "$comment_id" ]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$comment_body" \
              >/dev/null
          else
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$comment_body"
          fi

          # Pull requests created with GITHUB_TOKEN do not emit a pull_request
          # event. Dispatch validation explicitly against the generated branch.
          gh workflow run validate-repository.yml --ref "$BRANCH"
