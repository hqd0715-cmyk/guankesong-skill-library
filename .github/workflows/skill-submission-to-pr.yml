name: Skill submission to PR

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to ingest
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  create-skill-pr:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[Skill]') || contains(github.event.issue.labels.*.name, 'skill-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch issue body
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE_NUMBER: ${{ inputs.issue_number }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            issue_number="$DISPATCH_ISSUE_NUMBER"
          else
            issue_number="$EVENT_ISSUE_NUMBER"
          fi

          echo "Fetching issue #${issue_number} from ${GITHUB_REPOSITORY}"
          issue_title="$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json title --jq '.title')"
          issue_author="$(gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json author --jq '.author.login')"
          gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""' > issue-body.md

          echo "number=${issue_number}" >> "$GITHUB_OUTPUT"
          echo "author=${issue_author}" >> "$GITHUB_OUTPUT"
          echo "body_path=issue-body.md" >> "$GITHUB_OUTPUT"
          {
            echo "title<<EOF"
            echo "$issue_title"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Authorize internal submitter
        id: authorization
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_AUTHOR: ${{ steps.issue.outputs.author }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          permission="$(
            gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ISSUE_AUTHOR}/permission" \
              --jq '.permission' 2>/dev/null || echo "none"
          )"

          case "$permission" in
            admin|maintain|write)
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              echo "Authorized internal submitter: ${ISSUE_AUTHOR} (${permission})"
              ;;
            *)
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              echo "Issue author ${ISSUE_AUTHOR} does not have internal write permission."
              gh issue comment "$ISSUE_NUMBER" \
                --repo "$GITHUB_REPOSITORY" \
                --body "当前仓库采用莞客松内部代投稿流程。该 Issue 不会自动生成 Skill 或 Pull Request；请先把素材交给莞客松内部整理人统一处理。"
              ;;
          esac

      - name: Generate skill file
        if: steps.authorization.outputs.authorized == 'true'
        run: |
          python scripts/ingest_issue.py \
            --issue-number "${{ steps.issue.outputs.number }}" \
            --issue-title "${{ steps.issue.outputs.title }}" \
            --issue-body-file issue-body.md

      - name: Validate skill packages
        if: steps.authorization.outputs.authorized == 'true'
        run: |
          python scripts/validate_skills.py

      - name: Show generated changes
        if: steps.authorization.outputs.authorized == 'true'
        run: |
          git status --short
          git diff --stat

      - name: Commit and push skill branch
        if: steps.authorization.outputs.authorized == 'true'
        id: skill_branch
        shell: bash
        run: |
          set -euo pipefail

          branch="skill-submission/issue-${{ steps.issue.outputs.number }}"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add skills index

          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No generated skill changes detected."
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"
          timestamp="$(TZ=America/New_York date '+%Y-%m-%d %H:%M')"
          git commit -m "${timestamp}｜生成 issue #${{ steps.issue.outputs.number }} 的 Skill 投稿包"
          git push --force origin "$branch"
          git ls-remote --heads origin "$branch"

      - name: Create draft PR
        if: steps.skill_branch.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.skill_branch.outputs.branch }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail

          title="内部代投稿 Skill #${ISSUE_NUMBER}"
          body="This draft PR was generated from internal proxy-submission issue #${ISSUE_NUMBER}.

          Internal reviewers should verify Agent Skill structure, Codex/Claude Code compatibility, attribution, source, publication status, classification, quality, originality, and formatting before marking it ready."

          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Base: main"
          echo "Head: ${REPOSITORY_OWNER}:${BRANCH}"
          gh --version
          gh pr list --base main --head "${REPOSITORY_OWNER}:${BRANCH}" --state open --json url --jq '.[0].url // ""'

          existing_url="$(gh pr list --base main --head "${REPOSITORY_OWNER}:${BRANCH}" --state open --json url --jq '.[0].url // ""')"
          if [ -n "$existing_url" ]; then
            echo "Draft PR already exists: $existing_url"
            exit 0
          fi

          gh pr create \
            --draft \
            --base main \
            --head "${REPOSITORY_OWNER}:${BRANCH}" \
            --title "$title" \
            --body "$body"
