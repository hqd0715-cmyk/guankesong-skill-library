name: 内部 Skill 代投稿
description: 供莞客松内部成员录入已筛选、整理并完成来源核查的素材。
title: "[Skill] "
labels:
  - skill-submission
body:
  - type: markdown
    attributes:
      value: |
        此入口供拥有仓库写入权限的莞客松内部成员使用。提交后，GitHub Actions 会生成或更新对应的 Draft PR，仍需维护者检查内容、来源和公开风险后才能合并。
  - type: input
    id: skill_title
    attributes:
      label: Skill 标题
      placeholder: 用 AI 快速生成活动复盘
    validations:
      required: true
  - type: input
    id: skill_name
    attributes:
      label: Skill 英文 ID
      description: 可选。仅使用小写字母、数字和连字符，且不要包含 anthropic 或 claude。
      placeholder: event-retrospective
  - type: dropdown
    id: category
    attributes:
      label: 分类
      options:
        - AI Shock
        - AI + 专业方法论
        - 整活 Skill
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: 作者 / 公开署名
      placeholder: 张三 / 莞客松围炉会共创 / 莞客松团队
    validations:
      required: true
  - type: input
    id: source_provider
    attributes:
      label: 原始提供者
      description: 原始素材由谁提供；与公开署名相同也请填写。
      placeholder: 张三 / 某次围炉会参与者
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 素材来源
      description: 公开资料请附链接或明确出处。
      placeholder: 2026 莞客松围炉会 / 内部项目复盘 / https://...
    validations:
      required: true
  - type: input
    id: curator
    attributes:
      label: 整理人
      placeholder: 莞客松整理组 / 李四
    validations:
      required: true
  - type: input
    id: github
    attributes:
      label: GitHub 用户名
      description: 原始作者有可确认账号时填写；不要默认填写代投稿人的账号。
      placeholder: hqd0715
  - type: input
    id: tags
    attributes:
      label: 标签
      description: 用逗号分隔。
      placeholder: 活动复盘, 工作流
  - type: dropdown
    id: difficulty
    attributes:
      label: 难度
      options:
        - beginner
        - intermediate
        - advanced
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 适用场景
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 使用步骤
      description: 建议使用有序列表。
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt 示例
  - type: textarea
    id: notes
    attributes:
      label: 注意事项
  - type: textarea
    id: example
    attributes:
      label: 案例
  - type: dropdown
    id: publication_status
    attributes:
      label: 公开状态
      options:
        - 已确认适合公开
        - 需进一步核查
    validations:
      required: true
  - type: dropdown
    id: submission_type
    attributes:
      label: 投稿方式
      options:
        - internal-proxy
    validations:
      required: true
